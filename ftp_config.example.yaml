# 复制此文件为 ftp_config.yaml 并填写真实配置，ftp_config.yaml 已被 .gitignore 忽略

# FTP 服务器地址，支持 IP 或域名
host: '192.168.1.1'

# FTP 端口，默认 21
port: 21

# FTP 登录用户名
user: ''

# FTP 登录密码
pass: ''

# 前端项目本地路径，支持 ~/ 开头的路径
frontendPath: '~/project/frontend'

# 前端部署到 FTP 服务器上的目录名
frontendDir: 'www.example.com'

# 后端项目本地路径，支持 ~/ 开头的路径
backendPath: '~/project/backend'

# 后端可执行文件部署到 FTP 服务器上的目录名
backendDir: 'api.example.com/bin'

# SSH 登录用户名（用于上传后远程重启服务，需配置免密登录；若与 FTP 用户名相同可省略）
sshUser: 'example'

# 远程服务器上启动后端的命令（形如 'cd <bin 目录> && ./server'）。
# 后端部署流程：停止旧进程 → 备份为 server.bak.<时间戳> → FTP 上传 → 执行本命令启动
# → 按 serverPort 做健康检查（确认端口真正监听，失败时打印回滚指引）
serverStartCmd: 'cd /srv/api.example.com/bin && ./server'

# 后端监听端口，用于部署后确认服务真正启动（留空则默认 18080）
serverPort: 18080

# 移动端本地路径，支持 ~/ 开头的路径
mobilePath: '~/project/mobile'

# VisionRoam 项目本地路径（含 lib/main.server.dart 与 web/），支持 ~/ 开头的路径
visionroamPath: '~/project/visionroam'

# VisionRoam 远程部署目录（服务器上 server 二进制所在目录）
visionroamBinDir: '/var/www/visionroam/bin'

# VisionRoam systemd 服务名（留空则默认 visionroam.service）
visionroamService: 'visionroam.service'

# Flutter Web 管理后台源码目录（留空则自动用 项目路径/packages/admin_web）
visionroamAdminPath: ''
